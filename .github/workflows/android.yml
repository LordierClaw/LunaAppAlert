name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '15859902'
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and verify
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:lintDebug :app:testDebugUnitTest :app:assembleDebugAndroidTest :test-target:assembleAlphaDebug :test-target:assembleBetaDebug --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build-and-reports
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
            app/build/reports/
            app/build/test-results/
            test-target/build/outputs/apk/*/debug/*.apk
          retention-days: 14
